<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#05061a">
  <meta name="description" content="Juego diario de palabras: cuanto más rara tu respuesta, más lejos llega tu cohete.">
  <title>Hasta Plutón</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="preload" href="fuentes/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <canvas id="fondo" aria-hidden="true"></canvas>

  <div class="app">
    <header class="barra">
      <button class="marca" id="ir-inicio" aria-label="Inicio">
        <i data-cohete="#ff4f6a" data-escala="2"></i>
        <span id="marca-nombre">Hasta Plutón</span>
      </button>
      <div class="barra-acciones">
        <button class="btn icono" id="boton-sonido" aria-label="Sonido">♪</button>
        <button class="btn icono" id="boton-idioma" aria-label="Idioma">EN</button>
        <button class="btn icono" id="boton-ayuda" aria-label="?">?</button>
      </div>
    </header>

    <main id="pantalla" class="pantalla"></main>
  </div>

  <dialog class="dialogo" id="dialogo-ayuda">
    <div class="caja clara">
      <h2 id="ayuda-titulo"></h2>
      <ol class="ayuda-pasos" id="ayuda-pasos"></ol>
      <div class="ayuda-rarezas" id="ayuda-rarezas"></div>
      <button class="btn cian ancho" id="cerrar-ayuda"></button>
    </div>
  </dialog>
</body>
</html>
