<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#03050e">
  <meta name="description" content="Juego diario de palabras: cuanto más rara tu respuesta, más lejos llega tu cohete.">
  <title>Hasta Plutón</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="preload" href="fuentes/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Degradados del cohete: definidos una vez, en un SVG que siempre se pinta (si está oculto, no funcionan). -->
  <svg class="definiciones" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="hp-cuerpo" x1="0" x2="1"><stop offset="0" stop-color="#cfd8ef"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa6c8"/></linearGradient>
      <linearGradient id="hp-aleta" x1="0" x2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#c2304a"/></linearGradient>
      <radialGradient id="hp-ventana" cx=".35" cy=".35"><stop offset="0" stop-color="#bff1ff"/><stop offset=".6" stop-color="#3a8dde"/><stop offset="1" stop-color="#173f78"/></radialGradient>
      <linearGradient id="hp-fuego" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffb23d"/><stop offset="1" stop-color="#ff4f3d" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>
  <canvas id="cielo" aria-hidden="true"></canvas>
  <div class="nebulosa" aria-hidden="true"></div>

  <div class="app">
    <header class="barra">
      <button class="marca" data-accion="inicio" aria-label="Inicio">
        <span class="marca-logo" aria-hidden="true"></span>
        <span class="marca-nombre" data-t="titulo"></span>
      </button>
      <div class="barra-acciones">
        <button class="boton-icono" data-accion="ayuda" aria-label="?" data-t-aria="comoSeJuega">?</button>
        <button class="selector-idioma" data-accion="idioma" aria-label="Idioma"></button>
      </div>
    </header>

    <!-- ============ INICIO ============ -->
    <main class="pantalla" id="p-inicio">
      <section class="hero">
        <div class="hero-planeta" aria-hidden="true"><div class="planeta planeta-grande" data-planeta="saturno"></div></div>
        <p class="etiqueta" id="inicio-lanzamiento"></p>
        <h1 class="titulo-grande" data-t="titulo"></h1>
        <p class="lema" data-t="lema"></p>
        <button class="boton-despegar" data-accion="jugar">
          <span class="boton-despegar-brillo" aria-hidden="true"></span>
          <span id="texto-despegar" data-t="despegar"></span>
        </button>
        <p class="ya-jugado" id="ya-jugado" hidden></p>
        <div class="acciones-secundarias">
          <button class="boton-texto" data-accion="practica" data-t="practica"></button>
          <span aria-hidden="true">·</span>
          <button class="boton-texto" data-accion="ayuda" data-t="comoSeJuega"></button>
        </div>
      </section>

      <section class="panel viaje" id="panel-viaje">
        <div class="viaje-cabecera">
          <span class="etiqueta" data-t="tuViaje"></span>
          <span class="viaje-km"><b id="viaje-km">0</b> km <span data-t="recorridos"></span></span>
        </div>
        <div class="viaje-pista">
          <div class="viaje-linea"><div class="viaje-hecho" id="viaje-hecho"></div></div>
          <div class="planeta planeta-mini" id="viaje-desde"></div>
          <div class="viaje-cohete" id="viaje-cohete" aria-hidden="true"></div>
          <div class="planeta planeta-mini" id="viaje-hacia"></div>
        </div>
        <div class="viaje-pie"><span id="viaje-desde-txt"></span><span id="viaje-hacia-txt"></span></div>
        <div class="estadisticas" id="estadisticas"></div>
      </section>
    </main>

    <!-- ============ JUEGO ============ -->
    <main class="pantalla" id="p-juego" hidden>
      <aside class="altimetro" aria-hidden="true">
        <div class="altimetro-pista" id="altimetro"></div>
      </aside>

      <section class="juego">
        <div class="juego-cabecera">
          <span class="etiqueta" id="juego-etapa"></span>
          <span class="marcador"><b id="juego-puntos">0</b> <span data-t="puntos"></span></span>
        </div>
        <ol class="etapas" id="etapas"></ol>

        <article class="tarjeta-categoria" id="tarjeta">
          <div class="categoria-icono" id="categoria-icono"></div>
          <h2 class="categoria-nombre" id="categoria-nombre"></h2>

          <div class="combustible" aria-hidden="true">
            <div class="combustible-barra" id="combustible"></div>
          </div>
          <div class="combustible-texto"><span data-t="combustible"></span><b id="segundos">25</b></div>

          <form class="entrada" id="formulario" autocomplete="off">
            <input id="respuesta" name="respuesta" type="text" enterkeyhint="send" autocapitalize="off"
                   autocorrect="off" spellcheck="false" maxlength="60">
            <button type="submit" class="boton-enviar" aria-label="Enviar" data-t-aria="enviar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
        </article>

        <!-- Resultado de la etapa -->
        <article class="tarjeta-resultado" id="resultado-etapa" hidden>
          <div class="resultado-puntos" id="resultado-puntos"></div>
          <div class="resultado-rareza" id="resultado-rareza"></div>
          <p class="resultado-respuesta" id="resultado-respuesta"></p>
          <div class="lejanas">
            <span class="etiqueta" data-t="respuestasLejanas"></span>
            <ul id="lejanas"></ul>
          </div>
          <button class="boton-principal" id="boton-siguiente" data-accion="siguiente"></button>
        </article>
      </section>
    </main>

    <!-- ============ RESULTADO ============ -->
    <main class="pantalla" id="p-resultado" hidden>
      <section class="final">
        <div class="final-escena" aria-hidden="true">
          <div class="planeta planeta-final" id="final-planeta"></div>
          <div class="final-cohete"></div>
        </div>
        <p class="etiqueta" id="final-etiqueta"></p>
        <h1 class="final-destino" id="final-destino"></h1>
        <p class="final-puntos"><b id="final-puntos">0</b> <span data-t="puntos"></span></p>
        <ol class="final-etapas" id="final-etapas"></ol>
        <div class="final-acciones">
          <button class="boton-principal" data-accion="compartir" id="boton-compartir" data-t="compartir"></button>
          <button class="boton-secundario" data-accion="otra" id="boton-otra"></button>
        </div>
        <p class="aviso-copiado" id="aviso-copiado" role="status" aria-live="polite"></p>
        <p class="proximo" id="proximo"></p>
      </section>
    </main>
  </div>

  <!-- ============ AYUDA ============ -->
  <dialog class="dialogo" id="dialogo-ayuda">
    <h2 data-t="comoSeJuega"></h2>
    <ol class="ayuda-pasos" id="ayuda-pasos"></ol>
    <div class="ayuda-rarezas" id="ayuda-rarezas"></div>
    <button class="boton-principal" data-accion="cerrar-ayuda" data-t="entendido"></button>
  </dialog>
</body>
</html>
