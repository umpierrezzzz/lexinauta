<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sprites</title>
<style>
  body { background: #0b0b1e; color: #cfd6ff; font: 14px monospace; margin: 20px; }
  .fila { display: flex; flex-wrap: wrap; gap: 24px; align-items: end; margin-bottom: 30px; }
  figure { margin: 0; text-align: center; }
  canvas { image-rendering: pixelated; display: block; margin: 0 auto 6px; }
</style>
</head>
<body>
<div class="fila" id="planetas"></div>
<div class="fila" id="pequenos"></div>
<div class="fila" id="cohetes"></div>
<script type="module">
  import { canvasPlaneta, canvasCohete, PLANETAS } from "../js/pixel.js";
  for (const [id, tam, escala, cont] of [[null, 48, 4, "planetas"], [null, 16, 3, "pequenos"]]) {
    for (const tipo of Object.keys(PLANETAS)) {
      const f = document.createElement("figure");
      const c = canvasPlaneta(tipo, tam);
      requestAnimationFrame(() => { c.style.width = c.width * escala + "px"; });
      f.append(c, tipo);
      document.getElementById(cont).append(f);
    }
  }
  for (const color of ["#ff4f6a", "#4de1ff", "#ffd23f", "#3ddc84"]) {
    const f = document.createElement("figure");
    const c = canvasCohete(color);
    requestAnimationFrame(() => { c.style.width = c.width * 6 + "px"; });
    f.append(c, color);
    document.getElementById("cohetes").append(f);
  }
</script>
</body>
</html>
